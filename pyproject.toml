[project]
name = "autoresume"
version = "0.1.0"
description = "Tailor a resume to a job description from a verified experience bank."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pypdf",
    "pyyaml",
    "typer",
    "typst",
]

[project.scripts]
autoresume = "autoresume.cli:app"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresume"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
